name: CI/CD Pipeline

on: 
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  ci-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8

      - name: Flake8 lint testing
        run: |
          flake8 app/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }} 
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.DOCKER_USER}}/feedback-app:${{ github.sha }} \
            -t ${{ vars.DOCKER_USER}}/feebdack-app:latest \
            .
      - name: Push Docker image
        run: |
          docker push ${{ vars.DOCKER_USER}}/feedback-app:${{ github.sha }}
          docker push ${{ vars.DOCKER_USER}}/feebdack-app:latest
      
      - name: List docker images
        run: |
          docker images

