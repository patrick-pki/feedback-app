<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Event Feedback Hub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>📊 Event Feedback Hub</h1>
                <p>Collect and visualize feedback from your events in real-time</p>
            </div>
        </header>

        <!-- Dashboard Stats -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <div class="stat-info">
                    <h3 id="totalFeedback">0</h3>
                    <p>Total Feedback</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-info">
                    <h3 id="avgRating">0.0</h3>
                    <p>Average Rating</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📂</div>
                <div class="stat-info">
                    <h3 id="topCategory">-</h3>
                    <p>Top Category</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-info">
                    <h3 id="uniqueUsers">0</h3>
                    <p>Unique Users</p>
                </div>
            </div>
        </section>

        <!-- Main Content -->
        <div class="main-grid">
            <!-- Feedback Form -->
            <section class="form-section">
                <div class="card">
                    <h2>✍️ Submit Feedback</h2>
                    <form id="feedbackForm">
                        <div class="form-group">
                            <label for="name">Your Name</label>
                            <input type="text" id="name" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" placeholder="john@example.com">
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" required>
                                <option value="General">General</option>
                                <option value="UI/UX">UI/UX</option>
                                <option value="Content">Content</option>
                                <option value="Technical">Technical</option>
                                <option value="Speaker">Speaker</option>
                                <option value="Venue">Venue</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="rating">Rating</label>
                            <div class="rating-stars">
                                <span data-value="1">⭐</span>
                                <span data-value="2">⭐</span>
                                <span data-value="3">⭐</span>
                                <span data-value="4">⭐</span>
                                <span data-value="5">⭐</span>
                            </div>
                            <input type="hidden" id="rating" value="3">
                        </div>
                        <div class="form-group">
                            <label for="message">Your Feedback</label>
                            <textarea id="message" rows="4" placeholder="Tell us about your experience..." required></textarea>
                        </div>
                        <button type="submit" class="btn-primary">Submit Feedback</button>
                    </form>
                </div>
            </section>

            <!-- Feedback Feed -->
            <section class="feed-section">
                <div class="card">
                    <div class="feed-header">
                        <h2>📋 Recent Feedback</h2>
                        <button id="refreshBtn" class="btn-secondary">🔄 Refresh</button>
                    </div>
                    <div id="feedbackList" class="feedback-list">
                        <!-- Feedback items will be rendered here -->
                        <div class="empty-state">
                            <p>No feedback yet. Be the first to share!</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <span id="toastMessage">Success!</span>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
